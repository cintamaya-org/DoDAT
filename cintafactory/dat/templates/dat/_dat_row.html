<tr>
  <td><a href="{% url 'dat:my_detail' obj.pk %}">{{ obj.reference }}</a></td>
  <td>{{ obj.title }}</td>
  <td>{{ obj.application|default:"—" }}</td>
  <td>{{ obj.business_direction|default:"—" }}</td>
  <td>{{ obj.workflow_state_display }}</td>
  <td>{{ obj.owner|default:"—" }}</td>
  <td>{{ obj.created_at|date:"Y-m-d H:i" }}</td>
  <td>
    <a href="{% url 'dat:my_detail' obj.pk %}" class="btn-flat waves-effect">Détails</a>
    {% if obj.can_change %}
      <a href="/dat/manage/dats/crud/{{ obj.pk }}/change/" class="btn-flat waves-effect">Modifier</a>
    {% else %}
      <span class="text-muted-faint">—</span>
    {% endif %}
  </td>
</tr>
