{% if dat.status %}
  <span
    class="topbar__title-meta topbar__title-meta--{{ dat.status }}"
    aria-label="Version {{ dat.display_reference }}, statut {{ dat.get_status_display }}"
    title="{{ dat.display_reference }} · {{ dat.get_status_display }}"
  >
    <span class="topbar__version-reference">{{ dat.display_reference }}</span> · {{ dat.get_status_display|lower }}
  </span>
{% endif %}
