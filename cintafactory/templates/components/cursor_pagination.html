{% if is_paginated %}
  <div class="dat-list__pagination" role="navigation" aria-label="Navigation des dossiers">
    <div class="dat-list__pagination-actions">
      {% if has_previous %}
        <a class="btn waves-effect waves-light cinta-btn-primary" href="{{ previous_url }}" rel="prev">Précédent</a>
      {% else %}
        <button type="button" class="btn waves-effect waves-light cinta-btn-primary" disabled>Précédent</button>
      {% endif %}
      {% if has_next %}
        <a class="btn waves-effect waves-light cinta-btn-primary" href="{{ next_url }}" rel="next">Suivant</a>
      {% else %}
        <button type="button" class="btn waves-effect waves-light cinta-btn-primary" disabled>Suivant</button>
      {% endif %}
    </div>
  </div>
{% endif %}
