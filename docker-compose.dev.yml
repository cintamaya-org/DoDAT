services:
  web:
    build:
      context: .
      dockerfile: cintafactory/dockerfile
    container_name: test_factory_dev_web
    environment:
      DJANGO_SETTINGS_MODULE: cintafactory.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: 1
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: test_factory_db
      DATABASE_USER: test_factory_user
      DATABASE_PASSWORD: test_factory_pass
      RUN_MIGRATIONS: 1
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.office365.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      SERVER_EMAIL: ${SERVER_EMAIL:-webmaster@localhost}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_PUBLIC_URL: ${SEAWEEDFS_PUBLIC_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_TIMEOUT: ${SEAWEEDFS_TIMEOUT:-30}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in .env}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in .env}
      LIKEC4_EXPORT_URL: ${LIKEC4_EXPORT_URL:-http://likec4-exporter:9000/export}
      LIKEC4_EXPORT_DELETE_OLD: ${LIKEC4_EXPORT_DELETE_OLD:-1}
      LIKEC4_EXPORT_ENABLED: ${LIKEC4_EXPORT_ENABLED:-1}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-30}
      CLAMAV_SCAN_DIR: ${CLAMAV_SCAN_DIR:-/clamav_scan}
      DRAWIO_BASE_URL: ${DRAWIO_BASE_URL:-http://drawio:8080}
      DRAWIO_PUBLIC_URL: ${DRAWIO_PUBLIC_URL:-http://localhost:8102}
      DRAWIO_LIBS: ${DRAWIO_LIBS:-general}
      DRAWIO_CLIBS: ${DRAWIO_CLIBS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OAUTH_HTTP_TIMEOUT: ${OAUTH_HTTP_TIMEOUT:-10}
      OAUTH_ALLOW_EMAIL_LINKING: ${OAUTH_ALLOW_EMAIL_LINKING:-1}
      MICROSOFT_OAUTH_TENANT_ID: ${MICROSOFT_OAUTH_TENANT_ID:-common}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      AMAZON_OAUTH_CLIENT_ID: ${AMAZON_OAUTH_CLIENT_ID:-}
      AMAZON_OAUTH_CLIENT_SECRET: ${AMAZON_OAUTH_CLIENT_SECRET:-}
      OKTA_OAUTH_DOMAIN: ${OKTA_OAUTH_DOMAIN:-}
      OKTA_OAUTH_CLIENT_ID: ${OKTA_OAUTH_CLIENT_ID:-}
      OKTA_OAUTH_CLIENT_SECRET: ${OKTA_OAUTH_CLIENT_SECRET:-}
      OKTA_OAUTH_TOKEN_AUTH_METHOD: ${OKTA_OAUTH_TOKEN_AUTH_METHOD:-client_secret_basic}
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-dev_token_idHaf}
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-dev_likec4_api_token_change_me}
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    volumes:
      # IMPORTANT: mount your app folder (which contains manage.py AND templates/)
      - ./cintafactory:/app
      - clamav_scan:/clamav_scan
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:8101:8000"
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:16
    container_name: test_factory_db
    environment:
      POSTGRES_DB: test_factory_db
      POSTGRES_USER: test_factory_user
      POSTGRES_PASSWORD: test_factory_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_factory_user -d test_factory_db -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:5433:5432"

  drawio:
    image: jgraph/drawio
    container_name: test_factory_drawio
    environment:
      EXPORT_URL: http://drawio-export:8000/export
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DRAWIO_HOST_PORT:-8102}:8080"
    depends_on:
      - drawio-export

  drawio-export:
    image: jgraph/export-server
    container_name: test_factory_drawio_export
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DRAWIO_EXPORT_HOST_PORT:-8103}:8000"

  likec4:
    image: likec4-cli
    container_name: test_factory_likec4
    build:
      context: ./likec4
      dockerfile: Dockerfile
      args:
        GRAPHVIZ_VERSION: ${LIKEC4_GRAPHVIZ_VERSION:-}
        PLAYWRIGHT_VER: ${LIKEC4_PLAYWRIGHT_VER:-}
        LIKEC4_VER: ${LIKEC4_VER:-}
    entrypoint: ["/bin/sh", "-c"]
    command: ["node server.js & mkdir -p ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews} && touch ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews}/bootstrap.c4 && /usr/local/bin/likec4 dev ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews} --host 0.0.0.0"]
    security_opt:
      - no-new-privileges:true
    environment:
      LIKEC4_C4_FILE: ${LIKEC4_C4_FILE:-likec4/default.c4}
      LIKEC4_EDITOR_PORT: ${LIKEC4_EDITOR_PORT:-4173}
      LIKEC4_PREVIEW_DIR: ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in .env}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in .env}
      LIKEC4_METADATA_URL: http://web:8000/diagrams/likec4/metadata/
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-dev_token_idHaf}
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-dev_likec4_api_token_change_me}
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${LIKEC4_DEV_HOST_PORT:-5173}:5173"
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${LIKEC4_HMR_HOST_PORT:-24678}:24678"
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${LIKEC4_EDITOR_HOST_PORT:-4173}:4173"
    volumes:
      - ./likec4:/data

  likec4-exporter:
    image: likec4-cli
    container_name: test_factory_likec4_exporter
    build:
      context: ./likec4
      dockerfile: Dockerfile
      args:
        GRAPHVIZ_VERSION: ${LIKEC4_GRAPHVIZ_VERSION:-}
        PLAYWRIGHT_VER: ${LIKEC4_PLAYWRIGHT_VER:-}
        LIKEC4_VER: ${LIKEC4_VER:-}
    command: ["node", "/opt/likec4-worker/exporter.js"]
    security_opt:
      - no-new-privileges:true
    environment:
      LIKEC4_EXPORT_PORT: ${LIKEC4_EXPORT_PORT:-9000}
      LIKEC4_EXPORT_FORMAT: ${LIKEC4_EXPORT_FORMAT:-png}
      LIKEC4_EXPORT_VIEW: ${LIKEC4_EXPORT_VIEW:-}
      LIKEC4_EXPORT_MAX_RETRIES: ${LIKEC4_EXPORT_MAX_RETRIES:-3}
      LIKEC4_EXPORT_DELETE_OLD: ${LIKEC4_EXPORT_DELETE_OLD:-1}
      LIKEC4_EXPORT_LOCAL_DIR: ${LIKEC4_EXPORT_LOCAL_DIR:-/var/likec4-exports}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in .env}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in .env}
      LIKEC4_METADATA_URL: http://web:8000/diagrams/likec4/metadata/
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-dev_token_idHaf}
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-dev_likec4_api_token_change_me}
    volumes:
      - likec4_exports_dev:/var/likec4-exports
    depends_on:
      - seaweedfs
      - web

  clamav:
    image: clamav/clamav:latest
    container_name: test_factory_clamav
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamav_scan:/clamav_scan

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: test_factory_seaweedfs
    command: "server -dir=/data -master -volume -filer"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in .env}
      WEED_JWT_FILER_SIGNING_EXPIRES_AFTER_SECONDS: ${SEAWEEDFS_JWT_TTL_SECONDS:-60}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in .env}
      WEED_JWT_FILER_SIGNING_READ_EXPIRES_AFTER_SECONDS: ${SEAWEEDFS_JWT_TTL_SECONDS:-60}
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_VOLUME_JWT_WRITE_KEY:?Set SEAWEEDFS_VOLUME_JWT_WRITE_KEY in .env}
      WEED_JWT_SIGNING_EXPIRES_AFTER_SECONDS: ${SEAWEEDFS_JWT_TTL_SECONDS:-60}
      WEED_JWT_SIGNING_READ_KEY: ${SEAWEEDFS_VOLUME_JWT_READ_KEY:?Set SEAWEEDFS_VOLUME_JWT_READ_KEY in .env}
      WEED_JWT_SIGNING_READ_EXPIRES_AFTER_SECONDS: ${SEAWEEDFS_JWT_TTL_SECONDS:-60}
      WEED_CORS_ALLOWED_ORIGINS_VALUES: ${SEAWEEDFS_ALLOWED_ORIGINS:-http://localhost:8101}
      WEED_FILER_EXPOSE_DIRECTORY_METADATA_ENABLED: "false"
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${SEAWEEDFS_MASTER_PORT:-19333}:9333"
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${SEAWEEDFS_FILER_PORT:-18888}:8888"
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${SEAWEEDFS_VOLUME_PORT:-18080}:8080"
    volumes:
      - seaweedfs_data:/data

volumes:
  pgdata_dev:
  seaweedfs_data:
  likec4_exports_dev:
  clamav_scan:
