sonar.projectKey=Cintafactory-dev
sonar.projectName=Cintafactory

# Code analysé. Les tests sont déclarés séparément pour que SonarQube ne les
# compte pas comme du code de production à couvrir.
sonar.sources=cintafactory
sonar.tests=cintafactory
sonar.test.inclusions=**/tests.py,**/tests_*.py,**/tests_ops/**/*.py

sonar.python.version=3.12

# Rapport produit par le workflow "Tests unitaires" (coverage xml -o coverage.xml).
# Sans ce fichier, SonarQube affiche 0 % de couverture.
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/migrations/**,**/static/**,**/templates/**,.venv/**,terraform/**,k8s/**
