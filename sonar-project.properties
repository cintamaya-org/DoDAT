sonar.projectKey=Cintafactory-dev
sonar.projectName=DoDat

# Code analysé. Les tests sont déclarés séparément pour que SonarQube ne les
# compte pas comme du code de production à couvrir.
sonar.sources=cintafactory,likec4
sonar.tests=cintafactory,likec4/tests
sonar.test.inclusions=**/tests.py,**/tests_*.py,**/tests_ops/**/*.py,likec4/tests/**

sonar.python.version=3.12

# Rapports Python et JavaScript produits par le workflow "Tests unitaires".
# Sans ces fichiers, SonarQube ne peut pas importer la couverture correspondante.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/likec4.lcov

# Fichiers générés, tiers et ressources non applicatives seulement.
sonar.exclusions=**/migrations/**,**/static/**,**/templates/**,**/node_modules/**,.venv/**,terraform/**,k8s/**,likec4/ui/likec4-webcomponent.js

# Le câblage reste analysé, mais ne demande pas de couverture unitaire.
# Ne pas exclure globalement apps.py/admin.py/settings.py : certains contiennent
# autorisation, validation et autres comportements applicatifs testables.
sonar.coverage.exclusions=\
  **/__init__.py,\
  **/urls.py,\
  **/manage.py,\
  **/wsgi.py,\
  **/asgi.py,\
  **/gunicorn.conf.py,\
  cintafactory/cintafactory/apps.py,\
  cintafactory/dat/apps.py,\
  cintafactory/dat_viewflow/apps.py,\
  cintafactory/diagrams/apps.py,\
  cintafactory/workflows/apps.py,\
  likec4/ui/*.html
