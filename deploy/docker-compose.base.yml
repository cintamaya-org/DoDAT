version: "3.9"

include:
  - path: ../likec4/compose.renderers.yml
    env_file: ../likec4/compose.deploy.env

services:
  web:
    build:
      context: ..
      dockerfile: cintafactory/dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: cintafactory.cintafactory.settings
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-}
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-}
      LIKEC4_EXPORT_URL: ${LIKEC4_EXPORT_URL:-http://likec4-exporter:9000/export}
      LIKEC4_EXPORT_DELETE_OLD: ${LIKEC4_EXPORT_DELETE_OLD:-1}
      LIKEC4_EXPORT_ENABLED: ${LIKEC4_EXPORT_ENABLED:-1}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in environment file}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in environment file}
    expose:
      - "8050"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "manage.py", "check_runtime_dependencies", "--profile", "web"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - edge
      - app

  likec4:
    extends:
      file: ../likec4/compose.brokers.yml
      service: likec4
    environment:
      LIKEC4_EDITOR_PORT: ${LIKEC4_EDITOR_PORT:-4173}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in environment file}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in environment file}
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-}
    expose:
      - "4173"
    networks:
      - app

  likec4-exporter:
    extends:
      file: ../likec4/compose.brokers.yml
      service: likec4-exporter
    environment:
      LIKEC4_EXPORT_PORT: ${LIKEC4_EXPORT_PORT:-9000}
      LIKEC4_EXPORT_FORMAT: ${LIKEC4_EXPORT_FORMAT:-png}
      LIKEC4_EXPORT_VIEW: ${LIKEC4_EXPORT_VIEW:-}
      LIKEC4_EXPORT_MAX_RETRIES: ${LIKEC4_EXPORT_MAX_RETRIES:-3}
      LIKEC4_EXPORT_DELETE_OLD: ${LIKEC4_EXPORT_DELETE_OLD:-1}
      LIKEC4_EXPORT_LOCAL_DIR: ${LIKEC4_EXPORT_LOCAL_DIR:-/var/likec4-exports}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?Set SEAWEEDFS_JWT_WRITE_KEY in environment file}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?Set SEAWEEDFS_JWT_READ_KEY in environment file}
      LIKEC4_METADATA_URL: http://web:8050/diagrams/likec4/metadata/
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-}
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-}
    volumes:
      - likec4_exports_data:/var/likec4-exports
    depends_on:
      - web
    networks:
      - app

volumes:
  likec4_exports_data:

networks:
  edge:
  app:
