# Proxy SWAG de la démo, à copier une fois dans /opt/swag/config/nginx/proxy-confs/ sur le VPS.
# Le certificat wildcard *.cintamaya.com de SWAG couvre déjà ce sous-domaine.
server {
    listen 80;
    server_name dodat-demo.*;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dodat-demo.cintamaya.com;

    include /config/nginx/ssl.conf;
    include /config/nginx/resolver.conf;

    client_max_body_size 100m;

    location / {
        include /config/nginx/proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        set $upstream_app demo_factory_web;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
