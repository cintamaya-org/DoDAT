# Overlay de la démo publique, appliqué par-dessus docker-compose.yml :
#   docker compose -p demo_factory -f docker-compose.yml -f deploy/demo/docker-compose.demo.yml up -d
# L'exposition HTTPS est assurée par le SWAG déjà présent sur le VPS
# (voir deploy/demo/swag/dodat-demo.subdomain.conf) via le réseau swag-network.

services:
  web:
    environment:
      DJANGO_ENFORCE_STRICT_SECRETS: "1"
      SESSION_COOKIE_SECURE: "1"
      CSRF_COOKIE_SECURE: "1"
      # VPS partagé : on limite le nombre de workers (gunicorn.conf.py en lance 2*CPU+1 sinon).
      GUNICORN_CMD_ARGS: "--workers 2"
