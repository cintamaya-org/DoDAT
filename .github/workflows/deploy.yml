name: Déploiement DEV (test_factory)

on:
  pull_request:
    branches: [ main ]

# Empêche que deux déploiements tournent en même temps 
concurrency:
  group: deploy-dev-test_factory
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      # Récupère le code du dépôt sur le runner GitHub.
      - name: Récupération du code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # 4.3.1 

      # Prépare la connexion ssh avec le vps
      - name: Configuration de la connexion SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Missing independently verified VPS_KNOWN_HOSTS secret}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
          ssh-keygen -F "${VPS_HOST}" -f ~/.ssh/known_hosts >/dev/null

      # Envoie le contenu du dépôt vers le VPS en supprimer les fichiers qui ne sont plus dans le rep
      - name: Synchronisation du dépôt vers le VPS
        shell: bash
        run: |
          set -euo pipefail
          DEST="/opt/cintafactory/test"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            "${VPS_USER}@${VPS_HOST}" "mkdir -p ${DEST}"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:${DEST}/"

      # Trasmission des secrets au vps et lancement des dockers
      - name: Déploiement sur le VPS
        shell: bash
        env:
          DEV_DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          DEV_LIKEC4_METADATA_TOKEN: ${{ secrets.DEV_LIKEC4_METADATA_TOKEN }}
          DEV_LIKEC4_API_TOKEN: ${{ secrets.DEV_LIKEC4_API_TOKEN }}
          DEV_SEAWEEDFS_JWT_WRITE_KEY: ${{ secrets.DEV_SEAWEEDFS_JWT_WRITE_KEY }}
          DEV_SEAWEEDFS_JWT_READ_KEY: ${{ secrets.DEV_SEAWEEDFS_JWT_READ_KEY }}
          DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY: ${{ secrets.DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY }}
          DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY: ${{ secrets.DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY }}
          DEV_POSTGRES_DB: ${{ secrets.DEV_POSTGRES_DB }}
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          DEV_ALLOWED_HOST: ${{ secrets.DEV_ALLOWED_HOST }}
        run: |
          set -euo pipefail
          : "${DEV_DJANGO_SECRET_KEY:?Missing DEV_DJANGO_SECRET_KEY secret}"
          : "${DEV_LIKEC4_METADATA_TOKEN:?Missing DEV_LIKEC4_METADATA_TOKEN secret}"
          : "${DEV_LIKEC4_API_TOKEN:?Missing DEV_LIKEC4_API_TOKEN secret}"
          : "${DEV_SEAWEEDFS_JWT_WRITE_KEY:?Missing DEV_SEAWEEDFS_JWT_WRITE_KEY secret}"
          : "${DEV_SEAWEEDFS_JWT_READ_KEY:?Missing DEV_SEAWEEDFS_JWT_READ_KEY secret}"
          : "${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY:?Missing DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY secret}"
          : "${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY:?Missing DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY secret}"
          : "${DEV_POSTGRES_PASSWORD:?Missing DEV_POSTGRES_PASSWORD secret}"
          : "${DEV_ALLOWED_HOST:?Missing DEV_ALLOWED_HOST secret}"

          for secret_name in \
            DEV_LIKEC4_METADATA_TOKEN \
            DEV_LIKEC4_API_TOKEN \
            DEV_SEAWEEDFS_JWT_WRITE_KEY \
            DEV_SEAWEEDFS_JWT_READ_KEY \
            DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY \
            DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY; do
            secret_value="${!secret_name}"
            if [ "${#secret_value}" -lt 32 ]; then
              echo "${secret_name} must contain at least 32 characters." >&2
              exit 1
            fi
            case "${secret_value}" in
              replace-*|*change-me*|*change_me*)
                echo "${secret_name} still contains a placeholder value." >&2
                exit 1
                ;;
            esac
          done

          if [ "${DEV_LIKEC4_METADATA_TOKEN}" = "${DEV_LIKEC4_API_TOKEN}" ]; then
            echo "LikeC4 metadata and API tokens must be distinct." >&2
            exit 1
          fi
          if [ "${DEV_SEAWEEDFS_JWT_WRITE_KEY}" = "${DEV_SEAWEEDFS_JWT_READ_KEY}" ] || \
             [ "${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY}" = "${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY}" ] || \
             [ "${DEV_SEAWEEDFS_JWT_WRITE_KEY}" = "${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY}" ] || \
             [ "${DEV_SEAWEEDFS_JWT_WRITE_KEY}" = "${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY}" ] || \
             [ "${DEV_SEAWEEDFS_JWT_READ_KEY}" = "${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY}" ] || \
             [ "${DEV_SEAWEEDFS_JWT_READ_KEY}" = "${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY}" ]; then
            echo "All SeaweedFS read/write and filer/volume keys must be distinct." >&2
            exit 1
          fi

          DEV_DJANGO_SECRET_KEY_B64="$(printf '%s' "${DEV_DJANGO_SECRET_KEY}" | base64 -w0)"
          DEV_LIKEC4_METADATA_TOKEN_B64="$(printf '%s' "${DEV_LIKEC4_METADATA_TOKEN}" | base64 -w0)"
          DEV_LIKEC4_API_TOKEN_B64="$(printf '%s' "${DEV_LIKEC4_API_TOKEN}" | base64 -w0)"
          DEV_SEAWEEDFS_JWT_WRITE_KEY_B64="$(printf '%s' "${DEV_SEAWEEDFS_JWT_WRITE_KEY}" | base64 -w0)"
          DEV_SEAWEEDFS_JWT_READ_KEY_B64="$(printf '%s' "${DEV_SEAWEEDFS_JWT_READ_KEY}" | base64 -w0)"
          DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY_B64="$(printf '%s' "${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY}" | base64 -w0)"
          DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY_B64="$(printf '%s' "${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY}" | base64 -w0)"
          DEV_POSTGRES_DB_B64="$(printf '%s' "${DEV_POSTGRES_DB}" | base64 -w0)"
          DEV_POSTGRES_USER_B64="$(printf '%s' "${DEV_POSTGRES_USER}" | base64 -w0)"
          DEV_POSTGRES_PASSWORD_B64="$(printf '%s' "${DEV_POSTGRES_PASSWORD}" | base64 -w0)"
          DEV_ALLOWED_HOST_B64="$(printf '%s' "${DEV_ALLOWED_HOST}" | base64 -w0)"

          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "DEV_DJANGO_SECRET_KEY_B64='${DEV_DJANGO_SECRET_KEY_B64}' \
             DEV_LIKEC4_METADATA_TOKEN_B64='${DEV_LIKEC4_METADATA_TOKEN_B64}' \
             DEV_LIKEC4_API_TOKEN_B64='${DEV_LIKEC4_API_TOKEN_B64}' \
             DEV_SEAWEEDFS_JWT_WRITE_KEY_B64='${DEV_SEAWEEDFS_JWT_WRITE_KEY_B64}' \
             DEV_SEAWEEDFS_JWT_READ_KEY_B64='${DEV_SEAWEEDFS_JWT_READ_KEY_B64}' \
             DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY_B64='${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY_B64}' \
             DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY_B64='${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY_B64}' \
             DEV_POSTGRES_DB_B64='${DEV_POSTGRES_DB_B64}' \
             DEV_POSTGRES_USER_B64='${DEV_POSTGRES_USER_B64}' \
             DEV_POSTGRES_PASSWORD_B64='${DEV_POSTGRES_PASSWORD_B64}' \
             DEV_ALLOWED_HOST_B64='${DEV_ALLOWED_HOST_B64}' \
             bash -se" <<'REMOTE'
            set -euo pipefail
            docker network inspect swag-network >/dev/null 2>&1 || docker network create swag-network
            cd /opt/cintafactory/test

            export APP_NAME="test_factory"
            export DJANGO_SETTINGS_MODULE="cintafactory.settings"
            export APP_MODULE="cintafactory.wsgi:application"
            export DJANGO_DEBUG=0
            export DEV_DJANGO_SECRET_KEY="$(printf '%s' "${DEV_DJANGO_SECRET_KEY_B64}" | base64 -d)"
            export DJANGO_SECRET_KEY="$(printf '%s' "${DEV_DJANGO_SECRET_KEY_B64}" | base64 -d)"
            export LIKEC4_METADATA_TOKEN="$(printf '%s' "${DEV_LIKEC4_METADATA_TOKEN_B64}" | base64 -d)"
            export LIKEC4_API_TOKEN="$(printf '%s' "${DEV_LIKEC4_API_TOKEN_B64}" | base64 -d)"
            export SEAWEEDFS_JWT_WRITE_KEY="$(printf '%s' "${DEV_SEAWEEDFS_JWT_WRITE_KEY_B64}" | base64 -d)"
            export SEAWEEDFS_JWT_READ_KEY="$(printf '%s' "${DEV_SEAWEEDFS_JWT_READ_KEY_B64}" | base64 -d)"
            export SEAWEEDFS_VOLUME_JWT_WRITE_KEY="$(printf '%s' "${DEV_SEAWEEDFS_VOLUME_JWT_WRITE_KEY_B64}" | base64 -d)"
            export SEAWEEDFS_VOLUME_JWT_READ_KEY="$(printf '%s' "${DEV_SEAWEEDFS_VOLUME_JWT_READ_KEY_B64}" | base64 -d)"
            export DJANGO_ALLOWED_HOSTS="$(printf '%s' "${DEV_ALLOWED_HOST_B64}" | base64 -d)"
            export APP_PORT=8000
            export HOST_PORT=8101
            export POSTGRES_DB="$(printf '%s' "${DEV_POSTGRES_DB_B64}" | base64 -d)"
            export POSTGRES_USER="$(printf '%s' "${DEV_POSTGRES_USER_B64}" | base64 -d)"
            export POSTGRES_PASSWORD="$(printf '%s' "${DEV_POSTGRES_PASSWORD_B64}" | base64 -d)"
            export DB_HOST_PORT=5433
            export DATABASE_HOST="${APP_NAME}_db"
            export DATABASE_PORT="5432"

            docker compose -p "${APP_NAME}" up -d --build
          REMOTE

      # Supprime la clé SSH privée du runner, même si une étape précédente a échoué.
      - name: Nettoyage de la clé SSH locale
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_rsa
