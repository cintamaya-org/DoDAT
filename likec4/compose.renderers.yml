# Included by every active stack. Paths resolve from this file's directory.
x-renderer: &renderer
  image: likec4-renderer:local
  build:
    context: .
    dockerfile: Dockerfile
    target: renderer
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  command: ["node", "/opt/likec4/worker/renderer.js"]
  init: true
  restart: unless-stopped
  network_mode: none
  security_opt:
    - no-new-privileges:true
    - seccomp=${LIKEC4_SECCOMP_PROFILE:-./seccomp_profile.json}
  cap_drop:
    - ALL
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  read_only: true
  mem_limit: 2g
  cpus: "1.5"
  pids_limit: 256
  shm_size: 512m
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,mode=1777

services:
  likec4-codegen:
    <<: *renderer
    environment:
      LIKEC4_RENDER_OPERATION: codegen
    volumes:
      - codegen_input:/jobs/input:ro
      - codegen_output:/jobs/output

  likec4-png:
    <<: *renderer
    environment:
      LIKEC4_RENDER_OPERATION: png
    volumes:
      - png_input:/jobs/input:ro
      - png_output:/jobs/output

volumes:
  codegen_input:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=32m,nr_inodes=256,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700,nosuid,nodev,noexec"
  codegen_output:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=128m,nr_inodes=1024,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700,nosuid,nodev,noexec"
  png_input:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=32m,nr_inodes=256,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700,nosuid,nodev,noexec"
  png_output:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=128m,nr_inodes=1024,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700,nosuid,nodev,noexec"
