<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LikeC4 Viewer</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a20;
      --text: #e5e5e5;
      --muted: #9da6b5;
      --accent: #3ba55d;
      --font: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, rgba(59, 165, 93, 0.08), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(70, 172, 255, 0.05), transparent 32%),
                  var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }
    #root {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .message {
      margin: auto;
      padding: 18px 22px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .message strong { color: var(--accent); }
    likec4-view {
      flex: 1;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="message" id="message">Loading LikeC4 view...</div>
  </div>

  <script nonce="__VIEWER_NONCE__">
    (() => {
      const params = new URLSearchParams(location.search);
      const nonce = params.get('nonce');
      const bundle = params.get('bundle') || '';
      const match = bundle.match(/^bundles\/([a-f0-9-]{36})\/([a-f0-9]{64})\/likec4-webcomponent\.js$/);
      const message = document.getElementById('message');
      if (window.parent === window || !/^[a-f0-9]{64}$/.test(nonce || '') || !match) {
        message.textContent = 'Open this viewer through the diagram editor.';
        return;
      }
      let initialized = false;
      const receive = event => {
        const data = event.data;
        if (initialized || event.source !== window.parent || event.origin !== new URL(document.referrer || location.href).origin ||
            !data || data.type !== 'likec4:init' || data.nonce !== nonce || data.diagram_id !== match[1] || data.revision !== match[2] ||
            typeof data.bundle !== 'string' || new TextEncoder().encode(data.bundle).length > 8 * 1024 * 1024 ||
            typeof data.view !== 'string' || !/^[A-Za-z0-9_.-]{1,200}$/.test(data.view) || event.ports.length !== 1) return;
        initialized = true;
        window.removeEventListener('message', receive);
        const port = event.ports[0];
        const url = URL.createObjectURL(new Blob([data.bundle], { type: 'application/javascript' }));
        const script = document.createElement('script');
        script.src = url;
        script.onload = () => {
          URL.revokeObjectURL(url);
          if (!customElements.get('likec4-view')) { port.postMessage({ type: 'error', nonce }); return; }
          const view = document.createElement('likec4-view');
          view.setAttribute('view-id', data.view);
          view.setAttribute('browser', 'true');
          document.getElementById('root').replaceChildren(view);
          port.postMessage({ type: 'ready', nonce });
          port.close();
        };
        script.onerror = () => {
          URL.revokeObjectURL(url);
          message.textContent = 'Failed to load diagram.';
          port.postMessage({ type: 'error', nonce });
          port.close();
        };
        document.head.appendChild(script);
      };
      window.addEventListener('message', receive);
      window.parent.postMessage({ type: 'likec4:viewer-ready', nonce }, new URL(document.referrer || location.href).origin);
    })();
  </script>
</body>
</html>
