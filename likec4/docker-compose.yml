include:
  - path: ./compose.renderers.yml

services:
  likec4:
    extends:
      file: ./compose.brokers.yml
      service: likec4
    environment:
      LIKEC4_API_TOKEN: ${LIKEC4_API_TOKEN:-}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_JWT_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:-}
      SEAWEEDFS_JWT_WRITE_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:-}
